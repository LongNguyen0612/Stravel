apiVersion: v1
kind: Secret
metadata:
  name: stravel-secrets
  namespace: stravel
type: Opaque
stringData:
  # CHANGE THESE IN PRODUCTION — never commit real secrets
  POSTGRES_USER: "stravel"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  POSTGRES_DB: "stravel"
  DATABASE_URL: "postgresql://stravel:CHANGE_ME_IN_PRODUCTION@stravel-postgres:5432/stravel"
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_RANDOM_64_CHARS"
