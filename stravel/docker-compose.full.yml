# Expose all dependency ports to the host.
# Use this when backend + frontend run on macOS and dependencies run on Ubuntu:
#
#   docker compose -f docker-compose.yml -f docker-compose.full.yml up -d
#
# macOS backend/.env should point to <ubuntu-tailscale-ip>:
#   DATABASE_URL=postgresql://stravel:stravel_dev@100.79.32.101:5434/stravel
#   REDIS_URL=redis://100.79.32.101:6380
#   OLLAMA_BASE_URL=http://100.79.32.101:11434

services:
  db:
    ports:
      - "5434:5432"

  ollama:
    ports:
      - "11434:11434"

  redis:
    ports:
      - "6380:6379"
