apiVersion: apps/v1
kind: Deployment
metadata:
  name: stravel-vllm
  namespace: stravel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/part-of: stravel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/part-of: stravel
    spec:
      nodeSelector:
        gpu: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - "--model"
            - "Qwen/Qwen2.5-7B"
            - "--port"
            - "8001"
            - "--max-model-len"
            - "4096"
          ports:
            - containerPort: 8001
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            failureThreshold: 60
            periodSeconds: 10
            # 60 * 10s = 10 min window for model loading
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 10
          resources:
            requests:
              memory: "16Gi"
              cpu: "4000m"
              nvidia.com/gpu: "1"
            limits:
              memory: "32Gi"
              cpu: "8000m"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: stravel-vllm
  namespace: stravel
spec:
  selector:
    app.kubernetes.io/name: vllm
  ports:
    - port: 8001
      targetPort: 8001
