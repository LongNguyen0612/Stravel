apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: stravel
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert-rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["stravel-alertmanager:9093"]

    scrape_configs:
      - job_name: "stravel-backend"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["stravel"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: backend
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "${1}:8000"
        metrics_path: /metrics

  alert-rules.yml: |
    groups:
      - name: stravel-alerts
        rules:
          - alert: HighErrorRate
            expr: rate(stravel_http_requests_total{status_code=~"5.."}[5m]) / rate(stravel_http_requests_total[5m]) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Error rate above 5%"
              description: "HTTP 5xx error rate is {{ $value | humanizePercentage }}"

          - alert: SlowAgentExecution
            expr: histogram_quantile(0.95, rate(stravel_agent_execution_seconds_bucket[5m])) > 10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Agent execution p95 above 10s"
              description: "Agent {{ $labels.agent_name }} p95 latency is {{ $value }}s"

          - alert: StaleEntityCount
            expr: stravel_stale_entities_total > 20
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "More than 20 stale entities"
              description: "{{ $labels.entity_type }} has {{ $value }} stale entities"
