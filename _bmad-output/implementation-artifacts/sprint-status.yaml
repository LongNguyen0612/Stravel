#   Epic 9  = Chat-First UI Epic 3: Propose-First & Interactive Proposal Deck (10 stories)
#   Epic 10 = Chat-First UI Epic 4: B2B Agent Mode (5 stories)
# Story files live under implementation-artifacts/epic-{N}/
# - create-story → sets story to ready-for-dev
# - dev-story    → sets story to in-progress → review
# - code-review  → sets story to done

